name: Release

# Publishes napkinstack to PyPI on every vX.Y.Z tag (ADR-0002), following the uv and PyPA
# guides: a build with no permissions, then publication through Trusted Publishing, the
# only job to receive id-token: write, in the pypi environment which requires a
# maintainer's approval. No stored secret; provenance attestations generated by the PyPA
# action. This file name and the pypi environment are declared on PyPI: do not rename
# them.
#
# The tag's release page carries the section of CHANGELOG.md, published from the same
# reviewed file rather than written twice: the published package holds the engine and not
# the skeleton, so a project cannot learn from the artefacts what an update will merge
# into it (D62, D63).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Tag and version identical
        run: |
          VERSION=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and version $VERSION of pyproject.toml differ (ADR-0002)." \
              "Action: align the version through a pull request, then create tag v$VERSION."
            exit 1
          fi

      # Before publishing, not after: a version nobody can read before taking it is not
      # published at all.
      - name: Release notes for this version
        run: |
          if ! grep -qE "^## ${GITHUB_REF_NAME}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME." \
              "Action: add '## $GITHUB_REF_NAME — <date>', with what changes in the engine and" \
              "what changes in a project, then move the tag."
            exit 1
          fi

      - name: Package
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/napkinstack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  notes:
    name: Release notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The section of CHANGELOG.md, published where a project's team looks for it: the
      # tag's release page. Written once, in a reviewed file, and copied nowhere.
      - name: Publish the section as the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '
            $0 ~ "^" tag "( |$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::The section for $GITHUB_REF_NAME is empty."; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --repo "$REPO"
