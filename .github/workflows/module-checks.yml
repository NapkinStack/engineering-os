name: Modules

# Exécute les verbes standards sur les seuls modules touchés.
# Le niveau de validation est proportionnel à la criticité déclarée dans le MANIFEST
# (docs/os/07-gouvernance.md §6).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  discover:
    name: Modules touchés
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          MODS=$(git diff --name-only "$BASE"...HEAD \
            | grep -E '^modules/[^/]+/' \
            | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)
          [ "$MODS" = "" ] && MODS='[]'
          echo "modules=$MODS" >> "$GITHUB_OUTPUT"
          if [ "$MODS" = '[]' ]; then echo "any=false" >> "$GITHUB_OUTPUT";
          else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Modules touchés : $MODS"

  validate:
    name: ${{ matrix.module }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Criticité déclarée
        id: crit
        run: |
          LEVEL=$(grep -E '^\s*criticality:' "modules/${{ matrix.module }}/MANIFEST.yaml" \
                  | head -1 | awk '{print $2}')
          echo "level=${LEVEL:-standard}" >> "$GITHUB_OUTPUT"
          echo "Criticité : ${LEVEL:-standard}"

      - name: bootstrap
        run: make -C "modules/${{ matrix.module }}" bootstrap

      # Tous niveaux — docs/os/05-workflow.md §7
      - name: check
        run: make -C "modules/${{ matrix.module }}" check

      - name: test
        run: make -C "modules/${{ matrix.module }}" test

      # Niveaux élevé et critique — à brancher quand les cibles existent
      - name: Tests d'intégration
        if: steps.crit.outputs.level == 'eleve' || steps.crit.outputs.level == 'critique'
        run: |
          echo "TODO — make -C modules/${{ matrix.module }} test-integration"

      - name: E2E parcours critiques
        if: steps.crit.outputs.level == 'critique'
        run: |
          echo "TODO — make -C modules/${{ matrix.module }} test-e2e"
