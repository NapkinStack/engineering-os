name: Gouvernance

# Fitness functions d'architecture + périmètre de PR.
# Ces checks sont NON CONTOURNABLES : c'est ce qui distingue une règle d'un vœu pieux
# (docs/os/07-gouvernance.md).
#
# À faire une fois : Settings → Rules → Rulesets → exiger ces checks sur la branche
# principale. Sans cela, la CI informe mais ne garantit rien.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture:
    name: Fitness functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'requirements-dev.txt') }}

      - name: Dépendances
        run: pip install -r platform/fitness/requirements.txt -r requirements-dev.txt

      - name: Manifests, cycles de vie, dates de dépréciation
        run: python3 platform/fitness/manifests.py .

      - name: Frontières — graphe déclaré vs réel, cycles, accès données
        run: python3 platform/fitness/boundaries.py .

      - name: Skills synchronisées avec les playbooks
        run: python3 platform/sync_skills.py --check

      - name: Tests de la plateforme — chaque garde-fou prouve qu'il sait échouer
        run: bash platform/tests/run.sh

  scope:
    name: Périmètre et budget de revue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Une PR = un module
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          ./platform/fitness/pr_scope.sh origin/${{ github.base_ref }}

  hooks:
    name: Hooks et secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'requirements-dev.txt') }}

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      # Même configuration que les hooks locaux. Le hook « gitleaks » ne scanne que
      # les changements indexés, vides en CI : l'étape suivante couvre les secrets.
      - name: Hooks sur tous les fichiers
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      # Règle S1 : aucun secret dans le dépôt. Sortie masquée, les logs sont publics.
      - name: Secrets dans tout l'historique git
        run: pre-commit run gitleaks-historique --hook-stage manual --all-files
