name: Governance

# Architecture fitness functions, pull request scope, hooks and secrets.
# These checks are NOT BYPASSABLE: that is what separates a rule from a pious wish
# (skeleton/.nstack/handbook/07-governance.md).
#
# To do once: Settings → Rules → Rulesets → require these checks on the main branch.
# Without that, CI informs but guarantees nothing.
#
# Security, verified by zizmor: a read-only token, actions pinned by SHA and kept up to
# date by Dependabot, no token left in .git/config, and values coming from the context
# passed through env: instead of being inserted into the scripts.
#
# Tooling: uv, the only prerequisite (PDR-0001); dependencies pinned by uv.lock.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Fitness functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Dependencies
        run: uv sync --locked

      - name: Manifests, boundaries, skills, plan, hygiene
        run: uv run nstack fitness --root .

      - name: Platform tests — every guardrail proves it can fail
        run: uv run bash platform/tests/run.sh

  scope:
    name: PR scope and review budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 fetches every branch: no authenticated git fetch to do.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Dependencies
        run: uv sync --locked

      - name: One PR = one module
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: uv run nstack pr-scope --root . --base "origin/$BASE_REF"

  hooks:
    name: Hooks and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Dependencies
        run: uv sync --locked

      # The same configuration as the local hooks. The "gitleaks" hook only scans the
      # staged changes, empty in CI: the next step covers the secrets.
      - name: Hooks on every file
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Rule S1: no secret in the repository. Output redacted, the logs are public.
      - name: Secrets in the whole git history
        run: uv run pre-commit run gitleaks-history --hook-stage manual --all-files

      # A commit message and a pull request's description are pages anyone reads: the hook
      # that refuses a link into a private assistant session reads them here, where it
      # cannot be bypassed. Values from the context come through env (zizmor).
      - name: No private session link in a message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          said="$RUNNER_TEMP/said.txt"
          printf '%s\n' "$DESCRIPTION" > "$said"
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then git log --format=%B "$BASE..HEAD" >> "$said"; fi
          uv run pre-commit run no-session-link --hook-stage commit-msg --commit-msg-filename "$said"
