# Tooling updates: GitHub actions, pre-commit hooks, Python dependencies (uv.lock).
# The 7-day delay avoids adopting a version published the day before, giving a
# compromise time to be spotted. Every PR goes through the same mandatory checks.
#
# Actions and hooks exist in two copies, this repository and skeleton/:
# group-by: dependency-name updates them in the same pull request, one per dependency.
# github-actions reads a directory other than "/" literally, hence the path of the
# skeleton workflows.

version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/skeleton/.github/workflows"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        group-by: dependency-name
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directories: ["/", "/skeleton"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        group-by: dependency-name
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
