# Mises à jour de l'outillage : actions GitHub, hooks pre-commit, dépendances Python (uv.lock).
# Une PR par écosystème, pour ménager le budget de revue. Le délai de 7 jours évite
# d'adopter une version publiée la veille, le temps qu'une compromission soit repérée.
# Chaque PR passe par les mêmes checks obligatoires que les autres.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
