name: Feature
description: Nouvelle capacité utilisateur
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Cette issue doit être compréhensible par un autre humain **ou un agent**
        sans conversation orale. Sinon, elle n'est pas *Ready*.

  - type: input
    id: module
    attributes:
      label: Module cible
      description: UN SEUL. Si la tâche en touche deux, la découper (docs/os/02-modules.md §7).
      placeholder: modules/billing
    validations: { required: true }

  - type: textarea
    id: objectif
    attributes:
      label: Objectif
      description: Ce que l'utilisateur doit pouvoir faire. Une phrase.
    validations: { required: true }

  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: Pourquoi maintenant. Lien vers le PDR ou l'ADR si la décision est prise.
    validations: { required: true }

  - type: textarea
    id: hors-perimetre
    attributes:
      label: Hors périmètre
      description: Ce qui n'est explicitement PAS fait ici. C'est la section qui empêche le glissement.
    validations: { required: true }

  - type: textarea
    id: acceptation
    attributes:
      label: Critères d'acceptation
      description: Testables — ils constituent l'oracle de la tâche (docs/os/05-workflow.md §3).
      value: |
        - [ ] Étant donné <contexte>, quand <action>, alors <résultat observable>
        - [ ] Étant donné <erreur>, quand <action>, alors <comportement attendu>
    validations: { required: true }

  - type: checkboxes
    id: cas
    attributes:
      label: Cas à couvrir
      options:
        - label: Parcours nominal
        - label: Cas limites
        - label: Entrées invalides
        - label: Permissions
        - label: État vide / premier usage (si UI)
        - label: Erreur de dépendance externe

  - type: dropdown
    id: contrats
    attributes:
      label: Contrats
      options:
        - Aucun contrat impacté
        - Contrat consommé (existant)
        - Contrat produit modifié → issue séparée, expand/contract
    validations: { required: true }

  - type: checkboxes
    id: playbooks
    attributes:
      label: Playbooks à charger
      options:
        - label: security.md — authn/authz, secrets, données personnelles, entrées externes
        - label: data-migration.md — schéma ou données existantes
        - label: ux.md — surface utilisateur
        - label: tests.md — stratégie de test non évidente
        - label: operations.md — logs, retries, timeouts, rollback

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: Objectif compréhensible sans échange oral
          required: true
        - label: Un seul module cible
          required: true
        - label: Périmètre et hors périmètre explicites
          required: true
        - label: Critères d'acceptation testables
          required: true
        - label: Tient dans le budget de revue — sinon découper maintenant
          required: true
