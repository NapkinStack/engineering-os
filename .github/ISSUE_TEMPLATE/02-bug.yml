name: Bug
description: Comportement incorrect en production ou en test
labels: ["bug"]
body:
  - type: input
    id: module
    attributes:
      label: Module concerné
    validations: { required: true }

  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu vs observé
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Étapes minimales. Si non reproductible, le dire — c'est une information.
    validations: { required: true }

  - type: input
    id: impact
    attributes:
      label: Impact
      description: Qui est affecté, depuis quand, avec quelle gravité.
    validations: { required: true }

  - type: checkboxes
    id: garde-fou
    attributes:
      label: Boucle de feedback (docs/os/10-measurement.md §4)
      description: Corriger le bug ne suffit pas — améliorer le système qui l'a laissé passer.
      options:
        - label: Un test reproduisant le bug sera ajouté (il doit échouer AVANT le correctif)
          required: true
        - label: J'ai identifié pourquoi le système ne l'a pas détecté
          required: true
