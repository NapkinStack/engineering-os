# Copier template of the project skeleton (ADR-0001): the only one in this repository.
# Versions are the repository's tags (PEP 440). No "unsafe" feature: no _tasks, no
# _migrations, no _jinja_extensions; a test verifies it. Only .jinja files carry
# variables.

_subdirectory: skeleton
_min_copier_version: "9.18"

# The seats: files whose content is the project's (PDR-0010). Written once, as a form, when
# the project is created; no update merges them again. The table of
# skeleton/docs/os/00-overview.md §5 lists the same five, and a test binds the two.
_skip_if_exists:
  - /README.md
  - /SECURITY.md
  - /modules/README.md
  - /docs/adr/README.md
  - /docs/pdr/README.md

project_name:
  type: str
  help: Project name

github_repo:
  type: str
  help: The project's GitHub repository, of the form organisation/name
  validator: >-
    {% if not (github_repo | regex_search('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')) %}
    Expected: organisation/name, for example acme/billing.
    {% endif %}

owner_team:
  type: str
  help: >-
    Owner of the foundation: a GitHub team, organisation/team, or a GitHub user when the
    project has no organisation
  validator: >-
    {% set team = '[A-Za-z0-9-]+/[A-Za-z0-9._-]+' %}
    {% set user = '(?=[A-Za-z0-9-]{1,39}$)[A-Za-z0-9]+(-[A-Za-z0-9]+)*' %}
    {% if not (owner_team | regex_search('^(' ~ team ~ '|' ~ user ~ ')$')) %}
    Expected: organisation/team, for example acme/platform, or a user, for example alice.
    {% endif %}
