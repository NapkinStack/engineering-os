name: Modules

# Exécute les verbes standards sur les seuls modules touchés : nstack lit leurs
# commandes dans le MANIFEST.yaml du module, sans supposer aucune stack (P1).
# Le niveau de validation est proportionnel à la criticité déclarée dans le MANIFEST
# (docs/os/07-governance.md §6).
#
# Les noms de modules viennent des chemins modifiés par la PR : ils ne sont jamais
# insérés dans un script, seulement lus depuis une variable d'environnement.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    name: Modules touchés
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          MODS=$(git diff --name-only "$BASE"...HEAD \
            | grep -E '^modules/[^/]+/' \
            | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)
          [ "$MODS" = "" ] && MODS='[]'
          echo "modules=$MODS" >> "$GITHUB_OUTPUT"
          if [ "$MODS" = '[]' ]; then echo "any=false" >> "$GITHUB_OUTPUT";
          else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Modules touchés : $MODS"

  validate:
    name: ${{ matrix.module }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: NapkinStack, version du projet
        run: |
          VERSION=$(yq '._commit' .copier-answers.yml)
          uv tool install "napkinstack==${VERSION#v}" --with-executables-from pre-commit

      - name: Criticité déclarée
        id: crit
        run: |
          LEVEL=$(grep -E '^\s*criticality:' "modules/$MODULE/MANIFEST.yaml" \
                  | head -1 | awk '{print $2}')
          echo "level=${LEVEL:-standard}" >> "$GITHUB_OUTPUT"
          echo "Criticité : ${LEVEL:-standard}"

      - name: bootstrap
        run: nstack bootstrap "$MODULE"

      # Tous niveaux — docs/os/05-workflow.md §7
      - name: check
        run: nstack check "$MODULE"

      - name: test
        run: nstack test "$MODULE"

      # Niveaux élevé et critique — pas encore branchés (D9)
      - name: Tests d'intégration
        if: steps.crit.outputs.level == 'high' || steps.crit.outputs.level == 'critical'
        run: |
          echo "Non branché : tests d'intégration (D9)"

      - name: E2E parcours critiques
        if: steps.crit.outputs.level == 'critical'
        run: |
          echo "Non branché : parcours de bout en bout (D9)"
