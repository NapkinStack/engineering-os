name: Spike / Investigation
description: Lever une incertitude. Livrable = connaissance, pas code.
labels: ["spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question à laquelle répondre
      description: Une question fermée. Si elle est ouverte, le spike ne finira jamais.
    validations: { required: true }

  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "2 jours"
    validations: { required: true }

  - type: textarea
    id: livrable
    attributes:
      label: Livrable attendu
      description: |
        Une réponse documentée, un ADR, un prototype jetable.
        Le code produit ici n'est PAS destiné à la production.
    validations: { required: true }
