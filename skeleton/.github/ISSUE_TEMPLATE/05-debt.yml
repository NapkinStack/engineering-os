name: Dette technique
description: Dette identifiée, avec son coût et son déclencheur
labels: ["dette"]
body:
  - type: input
    id: module
    attributes:
      label: Module concerné
    validations: { required: true }

  - type: textarea
    id: dette
    attributes:
      label: Nature de la dette
    validations: { required: true }

  - type: textarea
    id: cout
    attributes:
      label: Coût actuel
      description: Ce qu'elle coûte AUJOURD'HUI. Sans coût constaté, ce n'est pas une dette prioritaire.
    validations: { required: true }

  - type: textarea
    id: declencheur
    attributes:
      label: Déclencheur de traitement
      description: Qu'est-ce qui la rendra prioritaire ? Sans déclencheur, elle ne sera jamais traitée.
    validations: { required: true }

  - type: checkboxes
    id: automatisable
    attributes:
      label: Backlog d'automatisation (docs/os/07-governance.md §9)
      options:
        - label: Cette dette vient d'une règle qui vit dans le prompt et devrait être automatisée
