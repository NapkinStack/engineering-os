[project]
name = "napkinstack"
version = "0.1.0"
description = "Engineering framework for several teams and their agents working in one repository: modules, contracts, guardrails in CI."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["PyYAML>=6.0", "copier==9.18.2", "pre-commit==4.6.2"]

[project.urls]
Homepage = "https://github.com/NapkinStack/engineering-os"
Source = "https://github.com/NapkinStack/engineering-os"
Issues = "https://github.com/NapkinStack/engineering-os/issues"

[project.scripts]
nstack = "napkinstack.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
required-version = ">=0.12.14,<0.13"

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"
