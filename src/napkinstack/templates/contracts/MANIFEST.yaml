module:
  name: contracts
  responsibility: >
    Defines and versions the interface contracts between modules.
  owner: "{{OWNER}}"
  contact: "https://github.com/{{GITHUB_REPO}}/discussions"
  lifecycle: active
  criticality: high
  user_facing: false

provides: []
consumes: []
data:
  owns: []
  shared: []
dependencies: []

# compat before any version is consumed: from then on a change to a consumed version — a
# corrected example as much as a renamed field — passes only with this command as merged
# (nstack compat, V1), and `nstack manifests` warns while it is missing. check and test are
# required once this module holds code (fitness M7). The tools are the project's, named in
# .nstack/tooling-profile.md.
commands:
#  check:     # validates every contract document against its format
#  test:      # the contract tests, run on both sides (.nstack/handbook/03-contracts.md §5)
#  compat:    # exits 0 when $NSTACK_HEAD_PATH is compatible with $NSTACK_BASE_PATH

docs:
  readme: README.md
  agents: AGENTS.md
  runbook: docs/runbook.md
