# Hooks du dépôt : un retour immédiat avant chaque commit.
# Contournables (--no-verify), donc jamais une garantie : la CI exécute la même
# configuration (job « Hooks et secrets »). Installation : pre-commit install
#
# Mise à jour : Dependabot (.github/dependabot.yml). Il ne connaît pas la version de
# gitleaks-historique : l'aligner sur celle du hook gitleaks, un test bloque sinon.
# pre-commit autoupdate ne voit que les tags de la branche principale : ne pas l'utiliser.

minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      # Aussi hors merge git : Copier écrit ses conflits de mise à jour directement dans
      # les fichiers (ADR-0001). Configuration recommandée par sa documentation.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Chargement réel du YAML : refuse les clés dupliquées, que PyYAML accepte sans rien dire.
      - id: check-yaml

  # Style et pièges du YAML (valeurs « yes »/« on », indentation). --strict : les
  # avertissements bloquent aussi. Règles : .yamllint.yaml
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Fichiers GitHub validés contre leurs schémas, embarqués dans l'outil : hors ligne.
  # Les workflows sont couverts par actionlint.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config

  # Sécurité des workflows. Hors ligne, pour des résultats identiques en local et en CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # Validité des workflows. shellcheck désactivé : absent en local, présent sur les
  # runners GitHub, il donnerait des résultats différents.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]

  # Au commit : ne scanne que les changements indexés.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # En CI : tout l'historique git. --redact, car les logs de CI sont publics.
      - id: gitleaks-historique
        name: Secrets dans tout l'historique git
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]
