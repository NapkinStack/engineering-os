# Correspondance playbooks → skills Claude Code.
#
# Les playbooks de `playbooks/` sont la SOURCE DE VÉRITÉ : markdown pur, portable,
# utilisable par n'importe quel agent. Les skills en sont dérivées.
# Ce fichier ne contient que le frontmatter à ajouter — jamais de contenu.
#
# Règles sur la `description` (c'est elle qui déclenche la skill) :
#   - dit QUOI et QUAND, à la troisième personne
#   - aucune instruction comportementale : elles vont dans le corps du playbook
#   - reprend les mots-clés que l'agent rencontrera réellement dans une tâche
#
# Un playbook sans entrée ici fait échouer `make skills-check`.

skills:
  securite:
    source: playbooks/securite.md
    description: >
      Règles de sécurité du projet : authentification, autorisation, secrets,
      validation des entrées, données personnelles, dépendances et actions à haut
      risque. Cette skill doit être utilisée lorsqu'une tâche touche à l'authn/authz,
      des secrets, des données sensibles, des entrées externes, un upload de fichier
      ou une exposition réseau.

  tests:
    source: playbooks/tests.md
    description: >
      Stratégie de test du projet : choix du niveau de test, écriture de l'oracle,
      cas limites, doublures et traitement des tests flaky. Cette skill doit être
      utilisée lorsque la stratégie de test n'est pas évidente, qu'une zone n'est pas
      testée, qu'un test est instable ou qu'un comportement est difficile à isoler.

  donnees-migration:
    source: playbooks/donnees-migration.md
    description: >
      Règles du projet sur les données et les migrations : expand/contract de schéma,
      backfill, suppression de données, propriété des données par module. Cette skill
      doit être utilisée lorsqu'une tâche touche un schéma de données, une migration,
      une transformation ou une suppression de données existantes.

  ux:
    source: playbooks/ux.md
    description: >
      Règles UX/UI du projet : primauté de la convention et du design system, les huit
      états d'une interface, messages d'erreur, accessibilité, performance perçue et
      comportement mobile. Cette skill doit être utilisée lorsqu'une tâche touche une
      surface visible par l'utilisateur.

  exploitation:
    source: playbooks/exploitation.md
    description: >
      Règles d'exploitation et de fiabilité du projet : timeouts, retries, logs
      structurés, métriques, alertes, health checks, rollback et dégradation
      contrôlée. Cette skill doit être utilisée lorsqu'une tâche touche
      l'observabilité, la gestion d'erreur, le déploiement ou un appel vers une
      dépendance externe.
