module:
  name: platform
  responsibility: >
    Fournit les verbes standards, les fitness functions et le scaffold de module.
  owner: NapkinStack/maintainers
  contact: "https://github.com/NapkinStack/engineering-os/discussions"
  lifecycle: active
  criticality: high

provides: []
consumes: []
data:
  owns: []
  shared: []
dependencies:
  - name: PyYAML
    purpose: "Lecture des manifests par les fitness functions"
    exit_strategy: >
      Usage limité à la lecture YAML. Remplaçable par tout autre parseur
      en quelques heures.

commands:
  bootstrap: uv sync --locked
  check: uv run nstack fitness --root ..
  test: uv run bash tests/run.sh
  run: "echo 'non applicable'"

docs:
  readme: README.md
  agents: AGENTS.md
  runbook: docs/runbook.md
