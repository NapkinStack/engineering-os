module:
  name: platform
  responsibility: >
    Provides the standard verbs, the fitness functions and the module scaffolding.
  owner: NapkinStack/maintainers
  contact: "https://github.com/NapkinStack/engineering-os/discussions"
  lifecycle: active
  criticality: high
  user_facing: false

provides: []
consumes: []
data:
  owns: []
  shared: []
dependencies:
  - name: PyYAML
    purpose: "Reading the manifests from the fitness functions"
    exit_strategy: >
      Limited to reading YAML. Replaceable by any other parser in a few hours.

commands:
  bootstrap: uv sync --locked
  check: uv run nstack fitness --root ..
  test: uv run bash tests/run.sh
  run: "echo 'not applicable'"

docs:
  readme: README.md
  agents: AGENTS.md
  runbook: docs/runbook.md
